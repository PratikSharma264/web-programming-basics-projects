<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Copy</title>
    <style>

        img{
            display : block;
            margin-left : auto;
            margin-right : auto;
            margin-top : 100px;
        }

        input{
            display : block;
            margin-left : auto;
            margin-right : auto;
            width : 400px;
            height : 28px;
            margin-top : 20px;
            padding-top : 8px;
            padding-bottom : 8px;
            padding-left : 20px;
            padding-right : 20px;
            border : 0.67px solid rgb(14, 2, 2);
            border-radius : 30px;
        }

        .btn {
            margin-top : 20px;
            display : flex;
            justify-content : center;
            align-items : center;
        }

        button{
            padding-left : 16px;
            padding-right : 16px;
            padding-top : 5px;
            padding-bottom : 5px;
            border : None;
            margin-left : 10px;
            margin-right : 10px;
            border-radius : 5px;
        }
    </style>
</head>
<body>  
    <div class = "main">
        <img src= "google.png" alt = "google_img">
        <input type = "text">
        <div class ="btn">
            <button>Google Search</button>
            <button>I'm Feeling Lucky</button>
        </div> 
    </div>
</body>
</html>
